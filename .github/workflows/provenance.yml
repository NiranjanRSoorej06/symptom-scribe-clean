name: Build Provenance

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-and-attest:
    name: Build and Attest Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm exec tsc -b

      - name: Build production artifact
        run: npm run build

      - name: Package production artifact
        run: tar -czf symptom-scribe-${GITHUB_REF_NAME}.tar.gz dist/

      - name: Generate artifact provenance
        uses: actions/attest@v4
        with:
          subject-path: symptom-scribe-${{ github.ref_name }}.tar.gz

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: symptom-scribe-${{ github.ref_name }}
          path: symptom-scribe-${{ github.ref_name }}.tar.gz
          if-no-files-found: error
